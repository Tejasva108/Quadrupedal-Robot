controller_manager:
  ros__parameters:
    update_rate: 100 #  Hz

    # joint_trajectory_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gazebo_joint_controller:
      type: forward_command_controller/ForwardCommandController

gazebo_joint_controller:
  ros__parameters:
    joints:
      - FL_Hip_Joint
      - FL_Upper_Joint
      - FL_Lower_Joint
      - FR_Hip_Joint
      - FR_Upper_Joint
      - FR_Lower_Joint
      - BL_Hip_Joint
      - BL_Upper_Joint
      - BL_Lower_Joint
      - BR_Hip_Joint
      - BR_Upper_Joint
      - BR_Lower_Joint
    interface_name: position
    command_interfaces:
      - position 
    state_interfaces:
      - position
      # - velocity
      # - effort